<!-- Upcoming Events Section -->
<section class="events" id="events-upcoming">
  <div class="container">
    <div class="section-header">
      <div class="section-header-content">
        <h2 class="section-title" id="events">Upcoming Events</h2>
        <p class="section-subtitle">See what's coming next in our community</p>
      </div>
      
      <div class="section-controls">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Search events..." id="event-search">
        </div>
        
        <div class="view-toggle">
          <button class="view-btn active" data-view="grid" aria-label="Grid view">
            <i class="fas fa-th"></i>
          </button>
          <button class="view-btn" data-view="list" aria-label="List view">
            <i class="fas fa-list"></i>
          </button>
        </div>
      </div>
    </div>
    
    <div class="timeline-filter">
      <button class="filter-btn active" data-filter="all">
        <i class="fas fa-layer-group"></i> All Events
      </button>
      <button class="filter-btn" data-filter="conference">
        <i class="fas fa-comments"></i> Conferences
      </button>
      <button class="filter-btn" data-filter="workshop">
        <i class="fas fa-laptop-code"></i> Workshops
      </button>
      <button class="filter-btn" data-filter="celebration">
        <i class="fas fa-glass-cheers"></i> Celebrations
      </button>
      <button class="filter-btn" data-filter="others">
        <i class="fas fa-ellipsis-h"></i> Others
      </button>
    </div>
    
    <div id="event-container" class="event-container grid-view">
      <div class="loading-spinner">
        <div class="spinner-circle"></div>
        <p>Loading exciting events...</p>
      </div>
    </div>
    
    <div class="load-more-container">
      <button id="load-more-btn" class="load-more-btn">
        <i class="fas fa-plus"></i> Load More Events
      </button>
    </div>
  </div>
</section>
