<!-- ── Events body ── -->
<div class="events-body">

  <div class="events-section-header">
    <h2 class="events-section-title"
        data-en="Events"
        data-ne="कार्यक्रमहरू">Events</h2>
    <div class="events-search">
      <input type="text" id="event-search"
             placeholder="Search events…"
             data-placeholder-en="Search events…"
             data-placeholder-ne="कार्यक्रम खोज्नुहोस्…"
             autocomplete="off"/>
    </div>
  </div>

  <div class="events-filters" id="events-filters">
    <button class="filter-pill active" data-filter="all"
            data-en="All" data-ne="सबै">All</button>
    <button class="filter-pill" data-filter="conference"
            data-en="Conference" data-ne="सम्मेलन">Conference</button>
    <button class="filter-pill" data-filter="workshop"
            data-en="Workshop" data-ne="कार्यशाला">Workshop</button>
    <button class="filter-pill" data-filter="celebration"
            data-en="Celebration" data-ne="उत्सव">Celebration</button>
    <button class="filter-pill" data-filter="others"
            data-en="Others" data-ne="अन्य">Others</button>
  </div>

  <!-- Big events group -->
  <div class="events-section-group" id="group-big" style="display:none">
    <div class="events-group-label"
         data-en="Featured Events"
         data-ne="विशेष कार्यक्रमहरू">Featured Events</div>
    <div class="event-grid-big" id="container-big"></div>
  </div>

  <!-- Small events group -->
  <div class="events-section-group" id="group-small" style="display:none">
    <div class="events-group-label"
         data-en="All Events"
         data-ne="सबै कार्यक्रमहरू">All Events</div>
    <div class="event-grid-small" id="event-container"></div>
  </div>

  <!-- Fallback spinner -->
  <div id="events-initial-spinner" class="events-spinner">
    <div class="spinner-ring"></div>
    <span data-en="Loading events…" data-ne="कार्यक्रमहरू लोड हुँदैछ…">Loading events…</span>
  </div>

  <div class="load-more-wrap">
    <button class="load-more-btn" id="load-more-btn" hidden
            data-en="Load More" data-ne="थप लोड गर्नुहोस्">Load More</button>
  </div>

</div>

<!-- Re-apply language after partial injection -->
<script>
  (function () {
    if (typeof window.applyLang === 'function') {
      window.applyLang(window.dmLang || (function () {
        try { return localStorage.getItem('dm-lang') || 'en'; } catch (e) { return 'en'; }
      })());
    }
    /* Also wire up the search placeholder after partial loads */
    var searchInput = document.getElementById('event-search');
    if (searchInput) {
      var lang = window.dmLang || 'en';
      searchInput.placeholder = lang === 'ne' ? 'कार्यक्रम खोज्नुहोस्…' : 'Search events…';
    }
  })();
</script>
