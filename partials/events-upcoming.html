<!-- partials/events-upcoming.html -->
<!-- CSS loaded in events.html <head> — no <link> tags here -->

<!-- ── Hero ── -->
<section class="events-upcoming-hero">
  <svg class="hero-bg" viewBox="0 0 1400 560" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <circle cx="700" cy="780" r="480" fill="none" stroke="rgba(210,175,110,0.10)" stroke-width="1.5"/>
    <circle cx="700" cy="780" r="610" fill="none" stroke="rgba(210,175,110,0.07)" stroke-width="1"/>
    <circle cx="700" cy="780" r="750" fill="none" stroke="rgba(210,175,110,0.05)" stroke-width="1"/>
    <circle cx="90"  cy="90"  r="190" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <line x1="280"  y1="0" x2="280"  y2="560" stroke="rgba(255,255,255,0.03)"   stroke-width="1"/>
    <line x1="560"  y1="0" x2="560"  y2="560" stroke="rgba(255,255,255,0.025)"  stroke-width="1"/>
    <line x1="840"  y1="0" x2="840"  y2="560" stroke="rgba(255,255,255,0.025)"  stroke-width="1"/>
    <line x1="1120" y1="0" x2="1120" y2="560" stroke="rgba(255,255,255,0.03)"   stroke-width="1"/>
    <rect x="1292" y="52" width="4"  height="64" rx="2" fill="rgba(210,175,110,0.38)"/>
    <rect x="1264" y="80" width="60" height="4"  rx="2" fill="rgba(210,175,110,0.38)"/>
    <g fill="rgba(255,255,255,0.09)">
      <circle cx="60"  cy="450" r="2"/><circle cx="90"  cy="450" r="2"/>
      <circle cx="120" cy="450" r="2"/><circle cx="150" cy="450" r="2"/>
      <circle cx="60"  cy="480" r="2"/><circle cx="90"  cy="480" r="2"/>
      <circle cx="120" cy="480" r="2"/><circle cx="150" cy="480" r="2"/>
    </g>
    <polygon points="1100,0 1400,0 1400,240" fill="rgba(210,175,110,0.04)"/>
  </svg>

  <!-- Hero text -->
  <div class="about-hero-content">
    <span class="eyebrow">Dharmikta Mandali</span>
    <h1>Upcoming Events</h1>
    <p class="hero-sub">Join our community gatherings, fellowship programs, and special occasions.</p>
  </div>

  <!-- Desktop calendar widget (hidden ≤900px, replaced by mobile section below) -->
  <div class="hero-calendar-wrap">
    <div class="hero-calendar" id="desktop-calendar">
      <div class="cal-header">
        <button class="cal-nav-btn" id="cal-prev" aria-label="Previous month">&#8249;</button>
        <span class="cal-month-label" id="cal-month-label">Month Year</span>
        <button class="cal-nav-btn" id="cal-next" aria-label="Next month">&#8250;</button>
      </div>
      <div class="cal-weekdays">
        <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
      </div>
      <div class="cal-days" id="cal-days"></div>
      <div class="cal-legend">
        <div class="cal-legend-item"><span class="cal-legend-dot today-dot"></span> Today</div>
        <div class="cal-legend-item"><span class="cal-legend-dot event-dot"></span> Event</div>
      </div>
    </div>
  </div>
</section>

<!-- Mobile calendar section (shown ≤900px) -->
<div class="mobile-calendar-section">
  <div class="mobile-calendar-inner">
    <div class="hero-calendar" id="mobile-calendar">
      <div class="cal-header">
        <button class="cal-nav-btn" id="cal-prev-m" aria-label="Previous month">&#8249;</button>
        <span class="cal-month-label" id="cal-month-label-m">Month Year</span>
        <button class="cal-nav-btn" id="cal-next-m" aria-label="Next month">&#8250;</button>
      </div>
      <div class="cal-weekdays">
        <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
      </div>
      <div class="cal-days" id="cal-days-m"></div>
      <div class="cal-legend">
        <div class="cal-legend-item"><span class="cal-legend-dot today-dot"></span> Today</div>
        <div class="cal-legend-item"><span class="cal-legend-dot event-dot"></span> Event</div>
      </div>
    </div>
  </div>
</div>

<!-- ── Events body ── -->
<div class="events-body">

  <div class="events-section-header">
    <h2 class="events-section-title">Events</h2>
    <div class="events-search">
      <input type="text" id="event-search" placeholder="Search events…" autocomplete="off"/>
    </div>
  </div>

  <div class="events-filters" id="events-filters">
    <button class="filter-pill active" data-filter="all">All</button>
    <button class="filter-pill" data-filter="conference">Conference</button>
    <button class="filter-pill" data-filter="workshop">Workshop</button>
    <button class="filter-pill" data-filter="celebration">Celebration</button>
    <button class="filter-pill" data-filter="others">Others</button>
  </div>

  <!-- Big events group -->
  <div class="events-section-group" id="group-big" style="display:none">
    <div class="events-group-label">Featured Events</div>
    <div class="event-grid-big" id="container-big"></div>
  </div>

  <!-- Small events group -->
  <div class="events-section-group" id="group-small" style="display:none">
    <div class="events-group-label">All Events</div>
    <div class="event-grid-small" id="event-container"></div>
  </div>

  <!-- Fallback spinner shown before any events load -->
  <div id="events-initial-spinner" class="events-spinner">
    <div class="spinner-ring"></div>
    Loading events…
  </div>

  <div class="load-more-wrap">
    <button class="load-more-btn" id="load-more-btn" hidden>Load More</button>
  </div>

</div>
