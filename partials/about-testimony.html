<!--
  Testimony card template.
  The Read More / Read Less button text is set by about-testimony.js.
  We expose window.testimonyBtnLabels so that script can use the
  correct language at render time.
-->
<template id="testimony-template">
  <div class="testimony-slide">
    <div class="testimony-card" data-testimony-id="">
      <div class="testimony-content-wrapper">
        <div class="testimony-author-sidebar">
          <div class="author-avatar-container"></div>
          <div class="author-info">
            <h3 class="author-name"></h3>
            <span class="author-role"></span>
            <span class="testimony-date"></span>
          </div>
        </div>
        <div class="testimony-main-content">
          <div class="testimony-excerpt"><p></p></div>
          <div class="testimony-full" style="display:none;"></div>
          <button class="read-more-btn">
            <span class="btn-text"
                  data-en="Read More"
                  data-ne="थप पढ्नुहोस्">Read More</span>
            <span class="read-more-arrow">&#8595;</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
(function () {
  /* Labels used by about-testimony.js when toggling the read-more button */
  window.testimonyBtnLabels = {
    readMore: { en: 'Read More',    ne: 'थप पढ्नुहोस्' },
    readLess: { en: 'Read Less',    ne: 'कम पढ्नुहोस्' }
  };

  function applyTestimonyLang(lang) {
    document.querySelectorAll('.about-testimony-page [data-en]').forEach(function (el) {
      var text = el.getAttribute('data-' + lang);
      if (text !== null) el.innerHTML = text;
    });

    /* Update any already-rendered read-more buttons inside testimony cards */
    document.querySelectorAll('.testimony-main-content .read-more-btn').forEach(function (btn) {
      var isExpanded = btn.classList.contains('expanded');
      var labelSet   = isExpanded
        ? window.testimonyBtnLabels.readLess
        : window.testimonyBtnLabels.readMore;
      var btnText = btn.querySelector('.btn-text');
      if (btnText) btnText.textContent = labelSet[lang] || labelSet['en'];
    });
  }

  document.addEventListener('dm:langchange', function (e) {
    applyTestimonyLang(e.detail.lang);
  });

  var saved = 'en';
  try { saved = localStorage.getItem('dm-lang') || 'en'; } catch (e) {}
  applyTestimonyLang(saved);
})();
</script>
