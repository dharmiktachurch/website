<!-- partials/about-testimony.html — CSS loaded in about.html <head> -->
<div class="about-testimony-page">

  <!-- ── Hero ── -->
  <div class="about-page-hero hero--testimony">

    <!--
      SVG artwork: abstract "waves of testimony" — layered arcs suggesting
      voices rising, rendered in translucent white so the gradient shows through.
      No icons, purely geometric.
    -->
    <svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"
      style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;">

      <!-- Rising arc layers — testimony "voices" -->
      <path d="M0 420 Q300 260 600 320 Q900 380 1200 200 L1200 500 L0 500 Z"
            fill="rgba(255,255,255,0.04)"/>
      <path d="M0 450 Q250 300 550 360 Q850 420 1200 260 L1200 500 L0 500 Z"
            fill="rgba(255,255,255,0.05)"/>
      <path d="M0 480 Q200 380 500 400 Q800 420 1200 340 L1200 500 L0 500 Z"
            fill="rgba(255,255,255,0.06)"/>

      <!-- Vertical rule lines — subtle rhythm -->
      <line x1="200" y1="0" x2="200" y2="500" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      <line x1="400" y1="0" x2="400" y2="500" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
      <line x1="600" y1="0" x2="600" y2="500" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
      <line x1="800" y1="0" x2="800" y2="500" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
      <line x1="1000" y1="0" x2="1000" y2="500" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

      <!-- Large open quotation form — pure geometry, no font dependency -->
      <!-- Left quote: two rounded rectangles -->
      <rect x="48"  y="80" width="18" height="90" rx="9" fill="rgba(255,255,255,0.12)"/>
      <rect x="80"  y="80" width="18" height="90" rx="9" fill="rgba(255,255,255,0.12)"/>
      <ellipse cx="57"  cy="180" rx="9" ry="6" fill="rgba(255,255,255,0.10)"/>
      <ellipse cx="89"  cy="180" rx="9" ry="6" fill="rgba(255,255,255,0.10)"/>

      <!-- Right close-quote -->
      <rect x="1094" y="300" width="18" height="90" rx="9" fill="rgba(255,255,255,0.10)"/>
      <rect x="1126" y="300" width="18" height="90" rx="9" fill="rgba(255,255,255,0.10)"/>
      <ellipse cx="1103" cy="296" rx="9" ry="6" fill="rgba(255,255,255,0.08)"/>
      <ellipse cx="1135" cy="296" rx="9" ry="6" fill="rgba(255,255,255,0.08)"/>

      <!-- Cross — top right, fine line -->
      <rect x="1062" y="52"  width="4" height="64" rx="2" fill="rgba(255,255,255,0.18)"/>
      <rect x="1038" y="76"  width="52" height="4"  rx="2" fill="rgba(255,255,255,0.18)"/>

      <!-- Scattered small circles — like light/stars -->
      <circle cx="920"  cy="60"  r="2.5" fill="rgba(255,255,255,0.18)"/>
      <circle cx="950"  cy="44"  r="1.5" fill="rgba(255,255,255,0.14)"/>
      <circle cx="975"  cy="72"  r="2"   fill="rgba(255,255,255,0.12)"/>
      <circle cx="880"  cy="88"  r="1.5" fill="rgba(255,255,255,0.10)"/>
      <circle cx="340"  cy="40"  r="2"   fill="rgba(255,255,255,0.10)"/>
      <circle cx="370"  cy="24"  r="1.5" fill="rgba(255,255,255,0.08)"/>
      <circle cx="310"  cy="60"  r="1.5" fill="rgba(255,255,255,0.08)"/>
    </svg>

    <div class="about-hero-content">
      <span class="eyebrow">Dharmikta Mandali</span>
      <h1>Testimonies of Faith</h1>
      <p>Stories of transformation, healing, and God's faithfulness in our community</p>
    </div>
  </div>

  <!-- ── Body ── -->
  <div class="about-page-body">

    <!-- Carousel block -->
    <div class="about-block" style="overflow:visible; padding:2rem 1.5rem 2.5rem;">

      <div class="testimonies-carousel">
        <button class="carousel-nav prev-btn" aria-label="Previous testimony" disabled>&#8249;</button>

        <div class="testimonies-container" id="testimonies-container">
          <div class="loading-testimonies">
            <div class="loading-spinner"></div>
            <p>Loading testimonies…</p>
          </div>
        </div>

        <button class="carousel-nav next-btn" aria-label="Next testimony">&#8250;</button>
      </div>

      <div class="carousel-indicators" id="carousel-indicators"></div>

      <div class="testimony-counter" id="testimony-counter">
        <span class="current-slide">1</span> of <span class="total-slides">0</span>
      </div>

    </div>

    <!-- Share CTA -->
    <div class="about-cta-block">
      <h3>Share Your Testimony</h3>
      <p>Has God done something remarkable in your life? We'd love to hear your story and share it with our community.</p>
      <a href="contact.html" class="about-cta-btn">Share Your Story</a>
    </div>

  </div>
</div>

<!--
  Testimony card template.
  - No icon in avatar: replaced with author initials rendered by JS.
  - No tags section.
  - No calendar icon: date shown as plain text.
-->
<template id="testimony-template">
  <div class="testimony-slide">
    <div class="testimony-card" data-testimony-id="">
      <div class="testimony-content-wrapper">

        <!-- Sidebar: initials avatar + name/role/date -->
        <div class="testimony-author-sidebar">
          <div class="author-avatar-container">
            <!-- JS fills this with a <span> of initials, no <i> icon -->
          </div>
          <div class="author-info">
            <h3 class="author-name"></h3>
            <span class="author-role"></span>
            <span class="testimony-date"></span>
          </div>
        </div>

        <!-- Text -->
        <div class="testimony-main-content">
          <div class="testimony-excerpt"><p></p></div>
          <div class="testimony-full" style="display:none;"></div>
          <button class="read-more-btn">
            <span class="btn-text">Read More</span>
            <span class="read-more-arrow">&#8595;</span>
          </button>
        </div>

      </div>
    </div>
  </div>
</template>
