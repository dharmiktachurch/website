    <line x1="280"  y1="0" x2="280"  y2="560" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    <line x1="560"  y1="0" x2="560"  y2="560" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    <line x1="840"  y1="0" x2="840"  y2="560" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    <line x1="1120" y1="0" x2="1120" y2="560" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    <rect x="1292" y="52" width="4" height="64" rx="2" fill="rgba(180,200,220,0.32)"/>

      <circle cx="60"  cy="450" r="2"/><circle cx="90"  cy="450" r="2"/>
      <circle cx="120" cy="450" r="2"/><circle cx="150" cy="450" r="2"/>
      <circle cx="60"  cy="480" r="2"/><circle cx="90"  cy="480" r="2"/>
      <circle cx="120" cy="480" r="2"/><circle cx="150" cy="480" r="2"/>
    </g>
  </svg>

  <div class="about-hero-content">
    <span class="eyebrow"
          data-en="Dharmikta Mandali"
          data-ne="धार्मिकता मण्डली">Dharmikta Mandali</span>
    <h1 data-en="Memories"
        data-ne="सम्झनाहरू">Memories</h1>
    <p class="hero-sub"
       data-en="A photographic record of the moments, milestones, and memories that have shaped our community."
       data-ne="ती पलहरू, उपलब्धिहरू र सम्झनाहरूको तस्बिर अभिलेख जसले हाम्रो समुदायलाई आकार दिएको छ।">
      A photographic record of the moments, milestones, and memories that have shaped our community.
    </p>
  </div>
</section>

<!-- ── Memories body ── -->
<div class="events-body">

  <div class="events-section-header">
    <h2 class="events-section-title"
        data-en="Our Story in Pictures"
        data-ne="तस्बिरमा हाम्रो कथा">Our Story in Pictures</h2>
  </div>

  <div class="events-filters" id="events-filters">
    <button class="filter-pill active" data-filter="all"
            data-en="All" data-ne="सबै">All</button>
    <button class="filter-pill" data-filter="conference"
            data-en="Conference" data-ne="सम्मेलन">Conference</button>
    <button class="filter-pill" data-filter="workshop"
            data-en="Workshop" data-ne="कार्यशाला">Workshop</button>
    <button class="filter-pill" data-filter="celebration"
            data-en="Celebration" data-ne="उत्सव">Celebration</button>
    <button class="filter-pill" data-filter="others"
            data-en="Others" data-ne="अन्य">Others</button>
  </div>

  <!-- Timeline container — JS fills this -->
  <div class="timeline memories-timeline" id="event-container">
    <div class="events-spinner">
      <div class="spinner-ring"></div>
      <span data-en="Loading memories…" data-ne="सम्झनाहरू लोड हुँदैछ…">Loading memories…</span>
    </div>
  </div>

  <div class="load-more-wrap">
    <button class="load-more-btn" id="load-more-btn" hidden
            data-en="Load More" data-ne="थप लोड गर्नुहोस्">Load More</button>
  </div>

</div>

<!-- Lightbox overlay (built once, reused) -->
<div class="mem-lightbox" id="mem-lightbox" role="dialog" aria-modal="true" aria-label="Memory image" hidden>
  <button class="mem-lightbox-close" id="mem-lightbox-close" aria-label="Close">&times;</button>
  <div class="mem-lightbox-inner">
    <img class="mem-lightbox-img" id="mem-lightbox-img" src="" alt="" />
    <div class="mem-lightbox-caption" id="mem-lightbox-caption"></div>
  </div>
</div>

<!-- Re-apply language after partial injection -->
<script>
  (function () {
    if (typeof window.applyLang === 'function') {
      window.applyLang(window.dmLang || (function () {
        try { return localStorage.getItem('dm-lang') || 'en'; } catch (e) { return 'en'; }
      })());
    }
  })();
</script>
