  /* ── Language helper ─────────────────────────────────────────── */
  function getLang() {
    try { return localStorage.getItem('dm-lang') || 'en'; } catch (e) { return 'en'; }
  }

  /* ── Apply bilingual text to all [data-en] elements ─────────── */
  function applyLang(lang) {
    document.querySelectorAll('.about-team-page [data-en]').forEach(function (el) {
      var text = el.getAttribute('data-' + lang);
      if (text !== null) el.innerHTML = text;
    });
  }

  /* ── Build one team card ─────────────────────────────────────── */
  function buildCard(member, lang) {
    var card = document.createElement('div');
    card.className = 'team-card';

    var img = document.createElement('img');
    img.src = member.photo;
    img.alt = member.name_en;

    var h3 = document.createElement('h3');
    h3.setAttribute('data-en', member.name_en);
    h3.setAttribute('data-ne', member.name_ne);
    h3.textContent = member['name_' + lang] || member.name_en;

    var p = document.createElement('p');
    p.setAttribute('data-en', member.role_en);
    p.setAttribute('data-ne', member.role_ne);
    p.textContent = member['role_' + lang] || member.role_en;

    card.appendChild(img);
    card.appendChild(h3);
    card.appendChild(p);
    return card;
  }

  /* ── Build one group section ─────────────────────────────────── */
  function buildGroup(group, lang) {
    var frag = document.createDocumentFragment();

    var title = document.createElement('p');
    title.className = 'team-group-title';
    title.setAttribute('data-en', group.label_en);
    title.setAttribute('data-ne', group.label_ne);
    title.textContent = group['label_' + lang] || group.label_en;

    var grid = document.createElement('div');
    grid.className = 'team-grid' + (group.gridModifier ? ' ' + group.gridModifier : '');

    group.members.forEach(function (member) {
      grid.appendChild(buildCard(member, lang));
    });

    frag.appendChild(title);
    frag.appendChild(grid);
    return frag;
  }

  /* ── Render all groups ───────────────────────────────────────── */
  function renderTeam(lang) {
    var container = document.getElementById('team-groups-container');
    if (!container) return;
    container.innerHTML = '';
    TEAM_DATA.groups.forEach(function (group) {
      container.appendChild(buildGroup(group, lang));
    });
  }

  /* ── Initial render ──────────────────────────────────────────── */
  var currentLang = getLang();
  renderTeam(currentLang);
  applyLang(currentLang);

  /* ── React to language switches ──────────────────────────────── */
  document.addEventListener('dm:langchange', function (e) {
    var lang = e.detail.lang;
    renderTeam(lang);
    applyLang(lang);
  });

})();
</script>
